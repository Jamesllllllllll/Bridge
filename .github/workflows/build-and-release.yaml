name: Build and Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check version
        shell: bash
        run: node -e 'if (process.env.GITHUB_REF_NAME !== `v${require("./package.json").version}`) process.exit(1)'
      - run: npm ci
      - run: npm test
      - run: npm run build:windows -- --publish never
      - run: npm run test:installed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-bridge-verification
          path: output/playwright/
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "release/Bridge-RockList-Setup-$version.exe"
          $assets = @($installer, "$installer.blockmap", 'release/latest.yml')
          foreach ($asset in $assets) { if (!(Test-Path $asset)) { throw "Missing $asset" } }
          $assets | ForEach-Object { $hash = Get-FileHash $_ -Algorithm SHA256; "$($hash.Hash.ToLower())  $(Split-Path $_ -Leaf)" } | Set-Content release/SHA256SUMS.txt
          gh release create "v$version" @assets release/SHA256SUMS.txt --verify-tag --title "Bridge $version — RockList build" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
