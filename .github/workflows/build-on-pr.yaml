name: Verify Windows installer
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:windows -- --publish never
      - run: npm run test:installed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-bridge-verification
          path: output/playwright/
